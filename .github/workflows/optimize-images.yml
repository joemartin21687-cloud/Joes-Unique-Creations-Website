name: Optimize website images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-images.yml"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Optimize large website images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import os

          folder = Path("images")
          max_dim = 1600
          min_size = 500 * 1024
          changed = []

          for path in folder.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".png", ".jpg", ".jpeg"}:
                  continue
              before = path.stat().st_size
              if before < min_size:
                  continue

              try:
                  with Image.open(path) as im:
                      im = ImageOps.exif_transpose(im)
                      w, h = im.size
                      if max(w, h) > max_dim:
                          scale = max_dim / max(w, h)
                          im = im.resize((max(1, round(w*scale)), max(1, round(h*scale))), Image.Resampling.LANCZOS)

                      if path.suffix.lower() == ".png":
                          im.save(path, format="PNG", optimize=True, compress_level=9)
                      else:
                          if im.mode not in ("RGB", "L"):
                              im = im.convert("RGB")
                          im.save(path, format="JPEG", quality=84, optimize=True, progressive=True)

                  after = path.stat().st_size
                  if after < before:
                      changed.append((str(path), before, after))
                  else:
                      # avoid replacing an asset if optimization somehow increased it
                      pass
              except Exception as exc:
                  print(f"Skipped {path}: {exc}")

          print("Optimized files:")
          for name, before, after in changed:
              print(f"{name}: {before/1024:.0f} KB -> {after/1024:.0f} KB")
          PY

      - name: Commit optimized images
        run: |
          if git diff --quiet -- images; then
            echo "No image changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Optimize website images for faster loading"
          git push
